[package]
name = "feather-draw"
version = "0.1.3"
description = "Motor vetorial compartilhado da suíte FeatherWorks: geometria, caminhos, estilos, SVG, PDF, unidades e tinta com pressão da caneta"
authors = ["FeatherWorks"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/feather-works/feather-draw"
publish = false

[dependencies]
# Fonte embutida no PDF (medidas e glifos) e compressão dos fluxos; os dois são Rust puro.
ttf-parser = "0.25"
miniz_oxide = "0.8"
